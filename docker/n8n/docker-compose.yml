# n8n self-hosted — Public API + volume persistente
# Uso: copie .env.example → .env, ajuste senhas, depois: docker compose up -d

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: mdoctor-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Fuso (ajuste no .env)
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Sao_Paulo}
      - TZ=${TZ:-America/Sao_Paulo}

      # Public REST API — /api/v1/*
      - N8N_PUBLIC_API_DISABLED=${N8N_PUBLIC_API_DISABLED:-false}
      # Playground Swagger em /api/v1/docs (opcional desabilitar em prod)
      - N8N_PUBLIC_API_SWAGGERUI_DISABLED=${N8N_PUBLIC_API_SWAGGERUI_DISABLED:-false}

      # Pedido comum em guias; n8n não documenta esta var — chaves são criadas na UI (Settings → n8n API)
      - N8N_API_KEY_ENABLED=${N8N_API_KEY_ENABLED:-true}

      # Proteção HTTP antes do login da UI (recomendado em servidor exposto)
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}

      # URLs vistas pelo editor e webhooks (local)
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5678/}

      # Credenciais criptografadas — fixe no .env para não perder secrets ao recriar o volume
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # Recomendações oficiais Docker
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  n8n_data:
    name: mdoctor_n8n_data
