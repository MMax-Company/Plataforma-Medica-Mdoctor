<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Memed Local</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f4f8; }
    h1 { color: #1557FF; }
    button { margin: 8px 4px; padding: 10px 18px; background: #1557FF; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1246d4; }
    #log { margin-top: 20px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; min-height: 120px; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
    #memed-container { margin-top: 16px; border: 2px dashed #9AA5B5; border-radius: 8px; min-height: 80px; display: flex; align-items: center; justify-content: center; color: #9AA5B5; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Teste Memed Local — sem pacientes reais</h1>
  <button onclick="firedGerada()">Disparar prescricaoGerada (via MdSinapsePrescricao)</button>
  <button onclick="firedImpressa()">Disparar prescricaoImpressa (fallback)</button>
  <button onclick="simularPrimeiroPaciente()">Simular P1 (openPrescription cold)</button>
  <button onclick="simularSegundoPaciente()">Simular P2 (openPrescription reuse)</button>
  <button onclick="limparLog()">Limpar log</button>

  <div id="memed-container">Container Memed (simulado)</div>
  <div id="log">Logs aparecerão aqui…</div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      const ts = new Date().toISOString().slice(11, 23);
      logEl.textContent += '[' + ts + '] ' + msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }
    function limparLog() { logEl.textContent = ''; }

    const origLog = console.log.bind(console);
    console.log = function(...args) { origLog(...args); log(args.join(' ')); };

    window.addEventListener('beforeprint', function(e) {
      e.preventDefault();
      log('beforeprint interceptado e cancelado');
    }, true);

    // Mock mínimo do SDK para testar localmente
    window.MdHub = window.MdHub || {
      module: {
        hide: function(m) { log('[MdHub] module.hide(' + m + ')'); },
        show: function(m) { log('[MdHub] module.show(' + m + ')'); }
      },
      event: {
        add: function(evt, fn) { log('[MdHub] event.add registrado: ' + evt); this._handlers = this._handlers || {}; this._handlers[evt] = fn; },
        fire: function(evt, payload) { log('[MdHub] event.fire: ' + evt); if (this._handlers && this._handlers[evt]) this._handlers[evt](payload); }
      }
    };

    window.MdSinapsePrescricao = window.MdSinapsePrescricao || {
      event: {
        add: function(evt, fn) { log('[MdSinapse] event.add registrado: ' + evt); this._handlers = this._handlers || {}; this._handlers[evt] = fn; },
        fire: function(evt, payload) { log('[MdSinapse] event.fire: ' + evt); if (this._handlers && this._handlers[evt]) this._handlers[evt](payload); }
      }
    };

    function firedGerada() {
      const payload = { pdfUrl: 'https://mock.pdf', patientId: '123', prescriptionId: 'rx-001' };
      log('--- Disparando prescricaoGerada ---');
      window.MdSinapsePrescricao.event.fire('prescricaoGerada', payload);
    }

    function firedImpressa() {
      const payload = { pdfUrl: 'https://mock.pdf', patientId: '123', prescriptionId: 'rx-001' };
      log('--- Disparando prescricaoImpressa ---');
      window.MdHub.event.fire('prescricaoImpressa', payload);
    }

    function simularPrimeiroPaciente() {
      log('[Memed] openPrescription chamado para: João Carlos Ferreira');
      log('[Memed] MdHub não existe, criando do zero (P1)');
      setTimeout(() => log('[Memed] prepareAndShowPrescription concluído (P1)'), 800);
    }

    function simularSegundoPaciente() {
      log('[Memed] openPrescription chamado para: Maria das Graças Alves');
      log('[Memed] MdHub existe, reutilizando (P2)');
      setTimeout(() => log('[Memed] prepareAndShowPrescription concluído (P2)'), 400);
    }
  </script>
</body>
</html>
