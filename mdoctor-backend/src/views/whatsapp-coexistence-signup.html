<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Doctor Prescreve — WhatsApp Business App Coexistence (staging)</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.25rem; }
  .warn { background: #fff3cd; border: 1px solid #ffe69c; padding: 12px; border-radius: 6px; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 0.85rem; margin-bottom: 4px; }
  input[type=text] { width: 100%; padding: 8px; box-sizing: border-box; }
  button { padding: 10px 16px; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  #log { white-space: pre-wrap; background: #111; color: #0f0; padding: 12px; border-radius: 6px; font-size: 0.8rem; min-height: 80px; margin-top: 16px; }
</style>
</head>
<body>
  <h1>WhatsApp Business App Coexistence — homologação (staging)</h1>
  <div class="warn">
    Ferramenta interna de staging. Não inicia onboarding de nenhum número
    automaticamente — só abre o fluxo oficial da Meta quando o botão é
    clicado, e só se a configuração (config_id) estiver definida no backend.
  </div>

  <div class="field">
    <label for="adminToken">Token de admin (Bearer, para autenticar a troca do code com o backend)</label>
    <input type="text" id="adminToken" placeholder="cole o JWT de admin aqui" />
  </div>

  <button id="loginBtn" disabled>Carregando configuração…</button>

  <div id="log">Aguardando…</div>

  <script src="/api/admin/whatsapp/coexistence/signup.js"></script>
</body>
</html>
