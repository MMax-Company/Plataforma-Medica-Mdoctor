<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento — Doctor Prescreve</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .muted { color: #666; font-size: 0.95rem; line-height: 1.5; }
    .status { margin: 1rem 0; padding: 0.75rem; border-radius: 8px; background: #f5f5f5; }
    .status.ok { background: #e8f5e9; color: #1b5e20; }
    .status.error { background: #ffebee; color: #b71c1c; }
    #pay-button { width: 100%; padding: 0.85rem; font-size: 1rem; border: 0; border-radius: 8px; background: #1565c0; color: #fff; cursor: pointer; }
    #pay-button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Pagamento da consulta</h1>
  <p class="muted" id="hint">Valor: <strong id="amount"></strong>. Após a confirmação pelo Stripe, o atendimento continua automaticamente no WhatsApp.</p>
  <div class="status" id="status">Carregando…</div>
  <button id="pay-button" disabled>Carregando…</button>
  <script src="/api/typebot-payment/page.js"></script>
</body>
</html>
