<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamento — Doctor Prescreve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f6f8; color: #1a2733; display: flex; justify-content: center; padding: 24px 16px; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(16, 42, 67, 0.08); max-width: 440px; width: 100%; padding: 28px; height: fit-content; }
    h1 { font-size: 1.15rem; margin-bottom: 4px; }
    .amount { font-size: 1.6rem; font-weight: 700; color: #0b5cad; margin: 12px 0 20px; }
    #payment-element { margin-bottom: 20px; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 8px; background: #0b5cad; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:disabled { background: #9db8cf; cursor: not-allowed; }
    .status { margin-top: 16px; font-size: 0.92rem; text-align: center; }
    .status.error { color: #b00020; }
    .status.ok { color: #0a7d33; font-weight: 600; }
    .muted { color: #5b6b7a; font-size: 0.85rem; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Doctor Prescreve</h1>
    <p class="muted">Taxa de avaliação médica — renovação de receita</p>
    <div class="amount" id="amount">…</div>
    <div id="payment-element"></div>
    <button id="pay-button" disabled>Pagar</button>
    <div class="status" id="status">Carregando pagamento seguro…</div>
    <p class="muted" id="hint">Pagamento processado pelo Stripe. Após a confirmação, seu atendimento continua automaticamente no WhatsApp.</p>
  </div>
  <script src="https://js.stripe.com/v3/"></script>
  <script src="/api/typebot-payment/page.js"></script>
</body>
</html>
